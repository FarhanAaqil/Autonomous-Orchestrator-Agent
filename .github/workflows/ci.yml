name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Focused security and persistence gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: phase2_test
          POSTGRES_PASSWORD: disposable-phase2-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d phase2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      ALLOW_INSECURE_LOCAL: "true"
      ACTION_EXECUTION_MODE: simulation
      ENABLE_REAL_EMAIL: "false"
      EXECUTOR_HMAC_SECRET: ci-only-signing-secret-with-32-characters
      GROQ_API_KEY: ""
      PHASE2_TEST_DATABASE_URL: postgresql://postgres:disposable-phase2-test-password@127.0.0.1:5432/phase2_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pytest-asyncio
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check orchestrator_core/ tests/

      - name: CI Guard — Check forbidden experimental imports
        run: |
          echo "Verifying orchestrator_core has no imports from experimental..."
          if grep -rn "from experimental" orchestrator_core/; then
            echo "ERROR: Found forbidden imports from experimental in orchestrator_core!"
            exit 1
          fi
          if grep -rn "import experimental" orchestrator_core/; then
            echo "ERROR: Found forbidden imports from experimental in orchestrator_core!"
            exit 1
          fi
          echo "Clean: Zero experimental imports found."

      - name: CI Guard — Enforce zero SDK leakage
        run: |
          pytest tests/test_no_sdk_leakage.py -v

      # The complete suite is the Phase 4 release gate. Keep this gate focused on
      # consent, action policy, outcome truthfulness, and network boundaries.
      - name: Run Phase 1 security regressions
        run: |
          pytest -v \
            tests/test_phase1_contracts.py \
            tests/test_phase1_security.py \
            tests/test_phase1_policy.py \
            tests/test_phase1_consent.py \
            tests/test_phase1_atomic.py \
            tests/test_phase1_outcomes.py \
            tests/test_phase1_network.py \
            tests/test_phase1_exit.py

      - name: Run focused Phase 2 regressions
        run: python scripts/test_local.py tests/test_phase2_*.py

      - name: Router Eval CI Gate (Frozen Test Split)
        run: |
          python eval/run_eval.py --dry-run --split test --ci-gate --no-save

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and check the compiled workspace
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run contract
          git diff --exit-code -- src/generated.ts
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium

      - name: Verify API contracts and static boundaries
        run: |
          python scripts/export_frontend_contract.py --check
          python scripts/check_frontend_budget.py
          python scripts/test_local.py tests/test_phase3_boundaries.py tests/test_password_recovery.py
          node --test toji-shell/endpoint.test.js

      - name: Exercise the compiled browser workflows
        run: |
          python scripts/phase3_browser_server.py > /tmp/toji-browser.log 2>&1 &
          browser_pid=$!
          trap 'kill "$browser_pid" 2>/dev/null || true' EXIT
          python -c "import time,urllib.request; exec('for attempt in range(30):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:8081/health\",timeout=1); break\n except OSError: time.sleep(1)\nelse: raise SystemExit(\"Browser fixture did not start\")')"
          npm --prefix frontend run test:browser
