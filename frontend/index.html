  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ── Markdown Parser with Guaranteed Fallback ──
    function renderFormattedMarkdown(text) {
      if (!text) return '';
      try {
        if (window.marked && window.DOMPurify) {
          const raw = window.marked.parse(text, { breaks: true, gfm: true });
          return window.DOMPurify.sanitize(raw);
        }
      } catch (err) {
        console.warn('Marked parsing error, using fallback:', err);
      }

      // Built-in fallback renderer (eliminates ###, **, *, etc.)
      let h = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Code blocks
      h = h.replace(/```([a-zA-Z0-9_]*)\n([\s\S]*?)```/g, (m, lang, code) => (
        `<pre><code>${code.trim()}</code></pre>`
      ));
      // Inline code
      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Headings
      h = h.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
      h = h.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      h = h.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      h = h.replace(/^# (.*$)/gim, '<h1>$1</h1>');

      // Bold & Italic
      h = h.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
      h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/\*(.*?)\*/g, '<em>$1</em>');

      // Bullet lists
      h = h.replace(/^[\*\-] (.*$)/gim, '<li class="ml-4 list-disc">$1</li>');
      // Numbered lists
      h = h.replace(/^(\d+)\. (.*$)/gim, '<li class="ml-4 list-decimal">$2</li>');

      // Paragraph wrapping
      const chunks = h.split(/\n\n+/);
      return chunks.map(chunk => {
        const trimmed = chunk.trim();
        if (!trimmed) return '';
        if (trimmed.startsWith('<h') || trimmed.startsWith('<pre') || trimmed.startsWith('<li')) {
          return trimmed;
        }
        return `<p>${trimmed.replace(/\n/g, '<br />')}</p>`;
      }).join('');
    }

    // ── API Service ──
    const api = {
      dispatch: async (command, conversationId = null) => {
        const payload = { command, context: {} };
        if (conversationId) payload.conversation_id = conversationId;
        const res = await fetch('/dispatch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.status === 422) {
          const err = await res.json();
          throw { isClarification: true, ...err };
        }
        if (res.status === 503) {
          const err = await res.json();
          throw { isCircuitOpen: true, ...err };
        }
        if (!res.ok) {
          let errText = res.statusText;
          try { const j = await res.json(); errText = j.detail || errText; } catch {}
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }
        return res.json();
      },
      dispatchStream: async (command, conversationId = null, callbacks = {}) => {
        const payload = { command, context: {} };
        if (conversationId) payload.conversation_id = conversationId;
        const res = await fetch('/dispatch/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.status === 422) {
          const err = await res.json();
          throw { isClarification: true, ...err };
        }
        if (res.status === 503) {
          const err = await res.json();
          throw { isCircuitOpen: true, ...err };
        }
        if (!res.ok) {
          let errText = res.statusText;
          try { const j = await res.json(); errText = j.detail || errText; } catch {}
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          let currentEvent = null;
          for (const line of lines) {
            if (line.startsWith('event: ')) {
              currentEvent = line.slice(7).trim();
            } else if (line.startsWith('data: ') && currentEvent) {
              const dataStr = line.slice(6).trim();
              try {
                const parsed = JSON.parse(dataStr);
                if (currentEvent === 'meta') callbacks.onMeta?.(parsed);
                else if (currentEvent === 'token') callbacks.onToken?.(parsed.token);
                else if (currentEvent === 'done') callbacks.onDone?.(parsed);
                else if (currentEvent === 'clarification') {
                  throw { isClarification: true, ...parsed };
                } else if (currentEvent === 'error') {
                  throw new Error(parsed.detail || parsed.error);
                }
              } catch (e) {
                if (e.isClarification) throw e;
              }
              currentEvent = null;
            }
          }
        }

          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ daily_budget_usd: budget })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      updateAgent: async (id, isActive) => {
        const res = await fetch(`/agents/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_active: isActive })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      subscribeJobEvents: (callbacks = {}) => {
        let isClosed = false;
        let lastEventId = null;
        let retryDelay = 1000;
        let es = null;
        let timer = null;

        function connect() {
          if (isClosed) return;
          callbacks.onStatusChange?.('reconnecting');
          const url = `/jobs/events${lastEventId ? `?last_event_id=${encodeURIComponent(lastEventId)}` : ''}`;
          try {
            es = new EventSource(url);
            es.onopen = () => {
              retryDelay = 1000;
              callbacks.onStatusChange?.('connected');
            };
            es.onmessage = (e) => {
              if (e.lastEventId) lastEventId = e.lastEventId;
              try {
                const parsed = JSON.parse(e.data);
                callbacks.onEvent?.(parsed.event || 'message', parsed.data || parsed);
              } catch {
                callbacks.onEvent?.('raw', e.data);
              }
            };
            ['job.created', 'job.updated', 'job.step', 'job.completed', 'agent.status'].forEach((evName) => {
              es.addEventListener(evName, (e) => {
                if (e.lastEventId) lastEventId = e.lastEventId;
                try {
                  const parsed = JSON.parse(e.data);
                  callbacks.onEvent?.(evName, parsed.data || parsed);
                } catch {
                  callbacks.onEvent?.(evName, e.data);
                }
              });
            });
            es.onerror = () => {
              if (es) { es.close(); es = null; }
              callbacks.onStatusChange?.('offline');
              if (!isClosed) {
                timer = setTimeout(() => {
                  retryDelay = Math.min(retryDelay * 1.5, 15000);
                  connect();
                }, retryDelay);
              }
            };
          } catch {
            callbacks.onStatusChange?.('offline');
            if (!isClosed) timer = setTimeout(connect, retryDelay);
          }
        }
        connect();
        return () => {
          isClosed = true;
          if (timer) clearTimeout(timer);
          if (es) { es.close(); es = null; }
          callbacks.onStatusChange?.('offline');
        };
      },
    };

    // ── Accessible Status Pill ──
    function StatusPill({ status, size = 'md' }) {
      const s = (status || '').toLowerCase();
      let bg = 'bg-slate-100 text-slate-700 border border-slate-300';
      let dot = 'bg-slate-400';
      let label = s.toUpperCase();

      if (s === 'pending') {
        bg = 'bg-amber-50 text-amber-800 border border-amber-300 font-bold';
        dot = 'bg-amber-500 animate-pulse';
      } else if (s === 'approved' || s === 'completed' || s === 'executed' || s === 'closed' || s === 'ok') {
        bg = 'bg-emerald-50 text-emerald-800 border border-emerald-300 font-bold';
        dot = 'bg-emerald-600';
      } else if (s === 'rejected' || s === 'failed' || s === 'open') {
        bg = 'bg-red-50 text-red-800 border border-red-300 font-bold';
        dot = 'bg-red-500';
      }

      const sizeClasses = size === 'sm' ? 'px-2 py-0.5 text-[10px]' : 'px-2.5 py-1 text-xs';

      return (
        <span className={`inline-flex items-center gap-1.5 rounded-full font-mono ${sizeClasses} ${bg}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${dot}`} />
          <span>{label}</span>

      );
    }

    // ── VIEW 1: DISPATCH CHATBOT STUDIO (ChatGPT Style: Left Sidebar + Fixed-in-Place Chat Window) ──
    function DispatchView() {
      const [command, setCommand] = useState("");
      const [loading, setLoading] = useState(false);
      const [viewModes, setViewModes] = useState({}); // { [msgId]: 'formatted' | 'raw' }
      const [copiedId, setCopiedId] = useState(null);
      const [conversationId, setConversationId] = useState(null);
      const [conversations, setConversations] = useState([]);
      const [agentRoster, setAgentRoster] = useState([]);
      const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth > 900);
      const [isListening, setIsListening] = useState(false);
      const [voiceOutput, setVoiceOutput] = useState(false);
      const [isPinned, setIsPinned] = useState(true);
      const messagesEndRef = useRef(null);
      const chatContainerRef = useRef(null);
      const recognitionRef = useRef(null);
      const silenceTimerRef = useRef(null);

      // IntersectionObserver sentinel on bottom message element
      useEffect(() => {
        const sentinel = messagesEndRef.current;
        if (!sentinel) return;
        const observer = new IntersectionObserver((entries) => {
          const [entry] = entries;
          setIsPinned(entry.isIntersecting);
        }, {
          root: chatContainerRef.current,
          threshold: 0.1
        });
        observer.observe(sentinel);
        return () => observer.disconnect();
      }, []);

      // Voice output toggle handler: immediately halts any ongoing speech synthesis
      const handleToggleVoiceOutput = () => {
        setVoiceOutput(prev => {
          const next = !prev;
          if (!next && ('speechSynthesis' in window)) {
            window.speechSynthesis.cancel();
            if (window.toji?.setAvatarState) window.toji.setAvatarState('idle');
          }
          return next;
        });
      };

      // Ensure that when voiceOutput becomes false for ANY reason, speech stops instantly
      useEffect(() => {
        if (!voiceOutput && ('speechSynthesis' in window)) {
          window.speechSynthesis.cancel();
          if (window.toji?.setAvatarState) window.toji.setAvatarState('idle');
        }
      }, [voiceOutput]);

      // Cleanup speech and audio recognition on unmount
      useEffect(() => {
        return () => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
          if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch {}
          }
        };
      }, []);

      // Listen for global voice toggle from tray or IPC
      useEffect(() => {
        if (window.toji?.onVoiceToggle) {
          window.toji.onVoiceToggle(() => {
            toggleListening();
          });
        }
      }, [isListening]);

      const speakText = (text) => {
        if (!('speechSynthesis' in window) || !voiceOutput) return;
        window.speechSynthesis.cancel();
        const clean = text.replace(/[*#`_~\[\]\(\)>]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(clean);
        utterance.rate = 1.05;
        utterance.pitch = 0.95;
        utterance.onstart = () => {
          if (window.toji?.setAvatarState) window.toji.setAvatarState('speaking');
        };
        utterance.onend = () => {
          if (window.toji?.setAvatarState) window.toji.setAvatarState('idle');
        };
        utterance.onerror = () => {
          if (window.toji?.setAvatarState) window.toji.setAvatarState('idle');
        };
        window.speechSynthesis.speak(utterance);
      };

      const toggleListening = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Speech recognition is not supported in this browser environment.");
          return;
        }
        if (isListening) {
          if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
          try { recognitionRef.current?.stop(); } catch {}
          setIsListening(false);
          if (window.toji?.setAvatarState) window.toji.setAvatarState('idle');
          return;
        }
        try {
          const rec = new SpeechRecognition();
          rec.continuous = true;
          rec.interimResults = true;
          rec.lang = 'en-US';
          rec.maxAlternatives = 1;

          let capturedTranscript = '';

          const resetSilenceTimer = (ms = 9000) => {
            if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
            silenceTimerRef.current = setTimeout(() => {
              try { rec.stop(); } catch {}
            }, ms);
          };

          rec.onstart = () => {
            setIsListening(true);
            if (window.toji?.setAvatarState) window.toji.setAvatarState('thinking');
            // Give 9 full seconds of patience for user to begin speaking
            resetSilenceTimer(9000);
          };

          rec.onresult = (evt) => {
            // Once speech has started, allow 3 seconds of pause after last word
            resetSilenceTimer(3000);
            let interim = '';
            let final = '';
            for (let i = evt.resultIndex; i < evt.results.length; i++) {
              const item = evt.results[i];
              if (item.isFinal) {
                final += item[0].transcript;
              } else {
                interim += item[0].transcript;
              }
            }
            const current = (final || interim || '').trim();
            if (current) {
              capturedTranscript = current;
              setCommand(current);
            }
          };

          rec.onerror = (e) => {
            // Non-fatal: if user hasn't started speaking yet, don't crash or abort
            if (e.error === 'no-speech') {
              return;
            }
            console.warn("Speech recognition notice:", e.error);
            if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
            setIsListening(false);
            if (window.toji?.setAvatarState) window.toji.setAvatarState('idle');
          };

          rec.onend = () => {
            if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
            setIsListening(false);
            if (window.toji?.setAvatarState) window.toji.setAvatarState('idle');
          };

          rec.start();
          recognitionRef.current = rec;

          console.error("Speech start error:", err);
          setIsListening(false);
        }

      const presets = [

      // Auto-scroll chat to bottom ONLY if pinned (prevents yank if user scrolled up)

      const handleExecute = async (cmdOverride) => {

              <button

          setLoading(false);

        fetchDetails();

        return () => clearInterval(t);
      }, [runId]);

      if (loading && !run) {
        return (
          <div className="p-12 text-center text-xs font-mono text-silver-700">

      return (

              >
                &larr; Back to Pipelines
              </button>
              <div>
                <h2 className="text-xl font-extrabold text-silver-900 font-mono">
                  Run #{runId.slice(0, 8)}
                </h2>
                <span className="text-xs text-silver-700 font-mono">Pipeline: {run?.pipeline_name || 'Workflow'}</span>
              </div>
            </div>
            <StatusPill status={run?.status || 'running'} />
          </div>

          {/* Stepper Timeline */}
          <div className="space-y-4">
            <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-accent-primary">
              Step Audit Log ({run?.steps?.length || 0} stages)
            </h3>

            {(!run?.steps || run.steps.length === 0) ? (
              <div className="p-8 rounded-2xl bg-white border border-silver-300 text-center text-xs font-mono text-silver-700 shadow-sm">
                Executing first step...
              </div>
            ) : (
              <div className="space-y-3">
                {run.steps.map((st, i) => {
                  const stepNum = st.step_number !== undefined ? st.step_number : (st.step_index !== undefined ? st.step_index + 1 : i + 1);
                  const agentName = st.agent_name || st.agent || 'Agent';
                  const stepTitle = st.step_name || `${agentName} Stage`;
                  const stepStatus = st.status || (st.success !== undefined ? (st.success ? 'completed' : 'failed') : 'completed');
                  let stepOutput = st.output_data || st.output_json || (st.error ? `Error: ${st.error}` : '');
                  if (typeof stepOutput === 'string' && (stepOutput.trim().startsWith('{') || stepOutput.trim().startsWith('['))) {
                    try {
                      const parsed = JSON.parse(stepOutput);
                      stepOutput = parsed.output || parsed.content || JSON.stringify(parsed, null, 2);
                    } catch {}
                  }

                  return (
                    <div key={i} className="bg-white border border-silver-400/80 rounded-2xl p-5 shadow-sm space-y-3">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <span className="w-6 h-6 rounded-full bg-accent-primary text-white flex items-center justify-center font-bold text-xs shadow-xs font-mono">
                            {stepNum}
                          </span>
                          <div>
                            <span className="font-bold text-sm text-silver-900 font-mono">{stepTitle}</span>
                            <span className="text-xs text-silver-700 font-mono block">Agent: {agentName}</span>
                          </div>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="text-xs font-mono text-silver-600">{st.latency_ms || 0}ms</span>
                          <StatusPill status={stepStatus} size="sm" />
                        </div>
                      </div>

                      {stepOutput && (
                        <div
                          className="prose-output bg-silver-50 rounded-xl p-4 border border-silver-200 text-xs max-h-56 overflow-y-auto"
                          dangerouslySetInnerHTML={{ __html: renderFormattedMarkdown(stepOutput) }}
                        />
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── VIEW 4: APPROVALS QUEUE ──
    function ApprovalsView() {
      const [filter, setFilter] = useState('pending');
      const [approvals, setApprovals] = useState([]);
      const [loading, setLoading] = useState(false);

      const load = async () => {
        setLoading(true);
        try {
          const data = await api.getApprovals(filter);
          setApprovals(data.items || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        load();
        const t = setInterval(load, 5000);
        return () => clearInterval(t);
      }, [filter]);

      const act = async (action, id) => {
        try {
          if (action === 'approve') {
            const reviewed = approvals.find(a => a.id === id);
            await api.approve(id, reviewed?.payload_hash, reviewed?.session_id);
          }
          if (action === 'reject') await api.reject(id);
          if (action === 'execute') await api.execute(id);
          load();
        } catch (err) {
          alert('Action failed: ' + err.message);
        }
      };

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="border-b border-silver-500/40 pb-5 space-y-2">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h2 className="text-2xl font-extrabold text-silver-900 tracking-tight flex items-center gap-2.5">
                  <span>🛡️</span> Human-in-the-Loop Safety Gate
                </h2>
                <p className="text-sm text-silver-800 mt-1">
                  Sensitive actions queue requiring explicit human authorization. Callers cannot substitute payloads at execution time.
                </p>
              </div>

              {/* Status Filter Tabs */}
              <div className="flex bg-white p-1 rounded-xl border border-silver-300 shadow-xs">
                {['pending', 'approved', 'executed', 'rejected', 'all'].map(tab => (
                  <button
                    key={tab}
                    onClick={() => setFilter(tab)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-mono uppercase font-bold transition-all ${
                      filter === tab ? 'bg-accent-primary text-white shadow-xs' : 'text-silver-700 hover:text-silver-950'
                    }`}
                  >
                    {tab}
                  </button>
                ))}
              </div>
            </div>

              <span>🔒</span>
              <span>
                <strong>Zero-Parameter Guarantee:</strong> `execute_approved(id)` takes no payload argument. The database record is the immutable source of truth.
              </span>

                <div key={appr.id} className="bg-white border border-silver-400/80 rounded-2xl p-5 shadow-sm space-y-4 flex flex-col justify-between">
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="font-mono text-xs font-bold text-accent-primary uppercase px-2.5 py-0.5 rounded bg-amber-50 border border-amber-200">
                        {appr.action_type}
                      </span>
                      <StatusPill status={appr.status} size="sm" />
                    </div>

                    <div className="text-xs font-mono text-silver-700">
                      ID: #{appr.id.slice(0, 10)}... • Created: {new Date(appr.created_at).toLocaleTimeString()}

                    <div className="text-xs break-all">
                      <p>Target: {appr.target}</p>
                      <p>Hash: {appr.payload_hash}</p>

                            try {

              <div className="text-3xl font-extrabold text-accent-primary font-mono mt-1">

              <span className="text-[11px] text-silver-700 font-mono mt-0.5 block">eval/fixed_set.json</span>

          </div>

          <div className="bg-white rounded-2xl p-6 shadow-sm border border-silver-400/80 space-y-4">
            <h3 className="font-bold text-sm text-silver-900 font-mono uppercase tracking-wider">
              Empirical Confusion Matrix Heatmap
            </h3>
            <div className="overflow-x-auto">
              <table className="w-full text-center border-collapse text-xs font-mono">
                <thead>
                  <tr className="border-b border-silver-300">
                    <th className="p-2 text-left text-silver-700 font-bold">Expected \ Predicted</th>
                    {predicted.map(p => (
                      <th key={p} className="p-2 text-silver-900 font-bold capitalize">
                        {p.replace('_agent', '')}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-silver-200">
                  {expected.map(exp => (
                    <tr key={exp}>
                      <td className="p-2 text-left font-bold text-silver-900 capitalize bg-silver-50">
                        {exp.replace('_agent', '')}
                      </td>
                      {predicted.map(pred => {
                        const val = matrix[exp]?.[pred] || 0;
                        const isDiag = exp === pred;
                        let style = 'bg-silver-50 text-silver-400';
                        if (val > 0) {
                          style = isDiag ? 'bg-accent-primary text-white font-black shadow-xs' : 'bg-amber-100 text-amber-900 font-bold';
                        }
                        return (
                          <td key={pred} className="p-1">
                            <div className={`py-2 px-2.5 rounded-lg text-xs font-mono ${style}`}>{val}</div>
                          </td>

                      })}

                      <td className="p-2.5 text-right font-black text-accent-primary">{(ag.f1 * 100).toFixed(1)}%</td>
                      <td className="p-2.5 text-right">{ag.tp}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

      const [isCreateOpen, setIsCreateOpen] = useState(false);
      const [newAgent, setNewAgent] = useState('research_agent');
      const [newGoal, setNewGoal] = useState('');
      const [newPriority, setNewPriority] = useState(0);
      const [creating, setCreating] = useState(false);

      const [cancellingAll, setCancellingAll] = useState(false);

      const loadJobs = async () => {
        try {
          const res = await api.getJobs({ status: statusFilter !== 'all' ? statusFilter : undefined, limit: 50 });
          setJobs(res.items || []);
          if (selectedJob) {
            const up = (res.items || []).find(j => j.id === selectedJob.id);
            if (up) setSelectedJob(up);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { loadJobs(); }, [statusFilter]);

      useEffect(() => {
        const unsub = api.subscribeJobEvents({
          onEvent: (ev, data) => {
            if (ev.startsWith('job.')) {
              loadJobs();
              if (selectedJob && (data.job_id === selectedJob.id || data.id === selectedJob.id)) {
                loadSteps(selectedJob.id);
              }
            }
          }
        });
        return () => unsub();
      }, [selectedJob?.id]);

      const loadSteps = async (id) => {
        setLoadingSteps(true);
        try {
          const st = await api.getJobSteps(id);
          setSteps(st || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoadingSteps(false);
        }
      };

      const handleSelect = (j) => {
        setSelectedJob(j);
        loadSteps(j.id);
        setExpandedSteps({});
      };

      const handleCancel = async (id) => {
        if (!confirm('Cancel this running job?')) return;
        try {
          await api.cancelJob(id);
          loadJobs();
        } catch (err) {
          alert('Cancel failed: ' + err.message);
        }
      };

      const handleCancelAllQueued = async () => {
        try {
          const res = await api.getJobs({ status: 'queued', limit: 100 });
          const queued = res.items || [];
          if (queued.length === 0) {
            alert('There are no queued jobs to cancel.');
            return;
          }
          if (!confirm(`Cancel all ${queued.length} queued jobs?`)) return;
          setCancellingAll(true);
          for (const q of queued) {
            try {
              await api.cancelJob(q.id);
            } catch (err) {
              console.error('Failed to cancel job ' + q.id, err);
            }
          }
          await loadJobs();
        } catch (err) {
          alert('Cancel all failed: ' + err.message);
        } finally {
          setCancellingAll(false);
        }
      };

      const handleAnswer = async (e) => {
        e.preventDefault();
        if (!selectedJob || !answerText.trim()) return;
        setAnswering(true);
        try {
          await api.answerJob(selectedJob.id, answerText);
          setAnswerText('');
          loadJobs();
          loadSteps(selectedJob.id);
        } catch (err) {
          alert('Answer failed: ' + err.message);
        } finally {
          setAnswering(false);
        }
      };

      const handleCreate = async (e) => {
        e.preventDefault();
        if (!newGoal.trim()) return;
        setCreating(true);
        try {
          const created = await api.createJob({ agent: newAgent, goal: newGoal, priority: Number(newPriority) });
          setIsCreateOpen(false);
          setNewGoal('');
          loadJobs();
          handleSelect(created);
        } catch (err) {
          alert('Create failed: ' + err.message);
        } finally {
          setCreating(false);
        }
      };

      const toggleStep = (id) => {
        setExpandedSteps(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const getKindBadge = (kind) => {
        const map = {
          tool_call: 'bg-indigo-100 text-indigo-800 border-indigo-300',
          propose: 'bg-amber-100 text-amber-800 border-amber-300',
          llm_call: 'bg-purple-100 text-purple-800 border-purple-300',
          ask_user: 'bg-blue-100 text-blue-800 border-blue-300',
          final: 'bg-emerald-100 text-emerald-800 border-emerald-300',
          error: 'bg-red-100 text-red-800 border-red-300'
        };
        return <span className={`px-1.5 py-0.5 rounded text-[10px] font-mono font-bold border ${map[kind] || 'bg-slate-100 text-slate-700'}`}>{kind.toUpperCase()}</span>;
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-silver-500/40 pb-5">
            <div>
              <h2 className="text-2xl font-extrabold text-silver-900 tracking-tight flex items-center gap-2.5">
                <span>💼</span> Autonomous Jobs Timeline & Step Telemetry
              </h2>
              <p className="text-sm text-silver-800 mt-1">
                Inspect autonomous execution loops, step latency, tool observations, token budgets, and human directives.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={handleCancelAllQueued}
                disabled={cancellingAll}
                className="px-3.5 py-2 rounded-xl bg-red-50 hover:bg-red-600 text-red-700 hover:text-white border border-red-200 font-bold text-xs transition-all flex items-center gap-1.5 shadow-xs cursor-pointer disabled:opacity-50"
                title="Cancel all queued tasks waiting in the backlog"
              >
                <span>⛔</span>
                <span>{cancellingAll ? 'Cancelling...' : 'Cancel All Queued'}</span>
              </button>
              <button onClick={loadJobs} className="px-3.5 py-2 rounded-xl bg-white hover:bg-silver-100 border border-silver-300 text-silver-800 font-bold text-xs transition-all flex items-center gap-1.5 shadow-xs cursor-pointer">
                <span>↻ Refresh</span>
              </button>
              <button onClick={() => setIsCreateOpen(true)} className="px-4 py-2 rounded-xl bg-accent-primary hover:bg-accent-hover text-white font-bold text-xs shadow-md transition-all flex items-center gap-1.5 cursor-pointer">
                <span>+ New Job</span>
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-5 space-y-4">
              <div className="flex items-center gap-1 bg-white p-1 rounded-xl border border-silver-300 text-xs font-mono overflow-x-auto">
                {['all', 'running', 'awaiting_input', 'queued', 'succeeded', 'failed'].map(st => (
                  <button
                    key={st}
                    onClick={() => setStatusFilter(st)}
                    className={`px-2.5 py-1.5 rounded-lg transition-all capitalize whitespace-nowrap cursor-pointer ${
                      statusFilter === st ? 'bg-accent-primary text-white font-bold' : 'text-silver-700 hover:text-silver-950'
                    }`}
                  >
                    {st.replace('_', ' ')}
                  </button>
                ))}
              </div>

              <div className="space-y-2.5">
                {loading ? (
                  <div className="p-8 text-center text-xs font-mono text-silver-600 bg-white rounded-2xl border border-silver-300">Loading jobs...</div>
                ) : jobs.length === 0 ? (
                  <div className="p-8 text-center text-xs font-mono text-silver-600 bg-white rounded-2xl border border-silver-300">No jobs found.</div>
                ) : (
                  jobs.map(j => {
                    const isSel = selectedJob?.id === j.id;
                    return (
                      <div
                        key={j.id}
                        onClick={() => handleSelect(j)}
                        className={`p-4 rounded-2xl cursor-pointer transition-all border ${
                          isSel ? 'bg-white border-accent-primary shadow-md ring-2 ring-accent-primary/20' : 'bg-white/80 hover:bg-white border-silver-300'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="font-mono text-xs font-bold text-silver-900">{j.agent}</span>
                          <StatusPill status={j.status} size="sm" />
                        </div>
                        <p className="text-xs text-silver-800 line-clamp-2 mb-2 font-medium">{j.goal}</p>
                        <div className="flex items-center justify-between text-[11px] font-mono text-silver-500 pt-2 border-t border-silver-200">
                          <span>#{j.id.slice(0, 8)}</span>
                          <div className="flex items-center gap-3">
                            <span>{j.steps_count || 0} steps</span>
                            <span>${Number(j.cost_usd || 0).toFixed(4)}</span>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>

            <div className="lg:col-span-7">
              {selectedJob ? (
                <div className="bg-white rounded-2xl border border-silver-300 p-6 shadow-sm space-y-6">
                  <div className="border-b border-silver-200 pb-5 space-y-3">
                    <div className="flex items-start justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <span className="text-xs font-mono font-bold text-accent-primary">Job #{selectedJob.id}</span>
                          <StatusPill status={selectedJob.status} />
                        </div>
                        <h3 className="text-base font-bold text-silver-900 leading-snug">{selectedJob.goal}</h3>
                      </div>
                      {['queued', 'running', 'awaiting_input'].includes(selectedJob.status) && (
                        <button
                          onClick={() => handleCancel(selectedJob.id)}
                          className="px-3 py-1.5 rounded-lg bg-red-50 hover:bg-red-600 text-red-700 hover:text-white border border-red-200 text-xs font-mono font-bold transition-all cursor-pointer"
                        >
                          Cancel Job
                        </button>
                      )}
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2 text-xs font-mono">
                      <div className="p-2.5 rounded-xl bg-silver-50 border border-silver-200">
                        <span className="text-[10px] text-silver-500 uppercase block">Agent</span>
                        <span className="font-bold text-silver-900 truncate block">{selectedJob.agent}</span>
                      </div>
                      <div className="p-2.5 rounded-xl bg-silver-50 border border-silver-200">
                        <span className="text-[10px] text-silver-500 uppercase block">Tokens</span>
                        <span className="font-bold text-silver-900 block">{selectedJob.tokens_used || 0}</span>
                      </div>
                      <div className="p-2.5 rounded-xl bg-silver-50 border border-silver-200">
                        <span className="text-[10px] text-silver-500 uppercase block">Cost USD</span>
                        <span className="font-bold text-accent-primary block">${Number(selectedJob.cost_usd || 0).toFixed(4)}</span>
                      </div>
                      <div className="p-2.5 rounded-xl bg-silver-50 border border-silver-200">
                        <span className="text-[10px] text-silver-500 uppercase block">Created</span>
                        <span className="font-bold text-silver-700 truncate block">{new Date(selectedJob.created_at).toLocaleTimeString()}</span>
                      </div>
                    </div>

                    {selectedJob.status === 'awaiting_input' && (
                      <form onSubmit={handleAnswer} className="mt-4 p-4 rounded-xl bg-amber-50 border border-amber-300 space-y-3">
                        <span className="text-xs font-bold text-amber-900 font-mono block">Agent requested human input:</span>
                        {selectedJob.pending_question && (
                          <div className="text-xs text-silver-900 bg-white p-2.5 rounded-lg border border-amber-200 font-mono">
                            {selectedJob.pending_question}
                          </div>
                        )}
                        <div className="flex gap-2">
                          <input
                            type="text"
                            value={answerText}
                            onChange={e => setAnswerText(e.target.value)}
                            placeholder="Type human answer to resume agent..."
                            className="flex-1 bg-white px-3 py-1.5 rounded-lg border border-amber-300 text-xs text-silver-900 focus:outline-none focus:border-accent-primary"
                            required
                          />
                          <button
                            type="submit"
                            disabled={answering}
                            className="px-4 py-1.5 rounded-lg bg-accent-primary hover:bg-accent-hover text-white text-xs font-mono font-bold transition-all disabled:opacity-50 cursor-pointer"
                          >
                            {answering ? 'Sending...' : 'Send'}
                          </button>
                        </div>
                      </form>
                    )}
                  </div>

                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <h4 className="text-xs font-extrabold uppercase font-mono tracking-wider text-silver-900">
                        Execution Step Trace ({steps.length})
                      </h4>
                      <button onClick={() => loadSteps(selectedJob.id)} className="text-xs text-accent-primary hover:underline font-mono cursor-pointer">
                        Refresh steps ↻
                      </button>
                    </div>

                    {loadingSteps ? (
                      <div className="p-6 text-center text-xs font-mono text-silver-600">Loading steps...</div>
                    ) : steps.length === 0 ? (
                      <div className="p-6 text-center text-xs font-mono text-silver-600 bg-silver-50 rounded-xl border border-silver-200">
                        No steps recorded yet.
                      </div>
                    ) : (
                      <div className="space-y-2.5">
                        {steps.map(st => {
                          const exp = expandedSteps[st.id];
                          return (
                            <div key={st.id} className="rounded-xl bg-silver-50 border border-silver-200 overflow-hidden text-xs">
                              <div
                                onClick={() => toggleStep(st.id)}
                                className="p-3 flex items-center justify-between cursor-pointer hover:bg-silver-100 transition-colors"
                              >
                                <div className="flex items-center gap-2">
                                  <span className="w-5 h-5 rounded-md bg-white border border-silver-300 flex items-center justify-center font-mono font-bold text-accent-primary text-[10px]">
                                    {st.step_number}
                                  </span>
                                  {getKindBadge(st.step_kind)}
                                  <span className="font-mono font-bold text-silver-900">{st.action_name || st.step_kind}</span>
                                </div>
                                <div className="flex items-center gap-3 font-mono text-[11px] text-silver-500">
                                  {st.latency_ms !== undefined && <span>{st.latency_ms}ms</span>}
                                  {st.tokens_used !== undefined && <span>{st.tokens_used} tok</span>}
                                  <span>{exp ? '▲' : '▼'}</span>
                                </div>
                              </div>

                              {exp && (
                                <div className="p-3 border-t border-silver-200 space-y-2 bg-white font-mono text-[11px]">
                                  {st.thought && (
                                    <div>
                                      <span className="text-[10px] text-silver-500 uppercase block font-bold">Thought</span>
                                      <p className="text-silver-800 bg-silver-50 p-2 rounded-lg border border-silver-200 font-sans text-xs whitespace-pre-wrap">{st.thought}</p>
                                    </div>
                                  )}
                                  {st.input_data && Object.keys(st.input_data).length > 0 && (
                                    <div>
                                      <span className="text-[10px] text-silver-500 uppercase block font-bold">Input</span>
                                      <pre className="p-2 rounded-lg bg-slate-900 text-slate-100 overflow-x-auto text-[10px]">{JSON.stringify(st.input_data, null, 2)}</pre>
                                    </div>
                                  )}
                                  {st.output_data && (
                                    <div>
                                      <span className="text-[10px] text-silver-500 uppercase block font-bold">Observation Output</span>
                                      <pre className="p-2 rounded-lg bg-slate-900 text-emerald-300 overflow-x-auto text-[10px]">{typeof st.output_data === 'string' ? st.output_data : JSON.stringify(st.output_data, null, 2)}</pre>
                                    </div>
                                  )}
                                  {st.error && (
                                    <div className="p-2 rounded-lg bg-red-50 border border-red-200 text-red-700">
                                      <strong className="block text-[10px]">Error:</strong>
                                      <span>{st.error}</span>
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              ) : (
                <div className="h-full min-h-[350px] flex flex-col items-center justify-center p-8 text-center bg-white rounded-2xl border border-silver-300 text-silver-600">
                  <span className="text-4xl mb-2 opacity-40">💼</span>
                  <h4 className="font-bold text-sm text-silver-900">No Job Selected</h4>
                  <p className="text-xs max-w-sm mt-1">Select an autonomous job from the queue on the left to inspect its timeline.</p>
                </div>
              )}
            </div>
          </div>

          {/* New Job Modal */}
          {isCreateOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-silver-300 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-silver-200 pb-3">
                  <h3 className="font-bold text-sm text-silver-900">Dispatch New Autonomous Job</h3>
                  <button onClick={() => setIsCreateOpen(false)} className="text-silver-500 hover:text-silver-900 cursor-pointer">✕</button>
                </div>
                <form onSubmit={handleCreate} className="space-y-3.5">
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Target Agent</label>
                    <select
                      value={newAgent}
                      onChange={e => setNewAgent(e.target.value)}
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl px-3 py-2 text-xs text-silver-900 focus:outline-none focus:border-accent-primary font-mono"
                    >
                      <option value="research_agent">Research Agent (Deep Search + arXiv)</option>
                      <option value="career_agent">Career Agent (Resume & Cover Letter)</option>
                      <option value="growth_agent">Growth Agent (Content Strategy)</option>
                      <option value="critic_agent">Critic Agent (Audit & Verification)</option>
                      <option value="github_agent">GitHub Agent (Repos, Issues, PRs)</option>
                      <option value="email_agent">Email Agent (Inbox & Drafts)</option>
                      <option value="linkedin_agent">LinkedIn Agent (Profiles & Posts)</option>
                      <option value="job_agent">Job Search Agent (Boards)</option>
                      <option value="briefing_agent">Daily Briefing Agent (Executive)</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Goal / Objective</label>
                    <textarea
                      rows={3}
                      value={newGoal}
                      onChange={e => setNewGoal(e.target.value)}
                      placeholder="Directive for autonomous execution loop..."
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl p-3 text-xs text-silver-900 focus:outline-none focus:border-accent-primary"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Priority</label>
                    <input
                      type="number"
                      value={newPriority}
                      onChange={e => setNewPriority(e.target.value)}
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl px-3 py-1.5 text-xs text-silver-900 focus:outline-none focus:border-accent-primary font-mono"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-silver-200">
                    <button type="button" onClick={() => setIsCreateOpen(false)} className="px-4 py-2 rounded-xl bg-silver-100 text-silver-700 text-xs font-mono font-bold cursor-pointer">Cancel</button>
                    <button type="submit" disabled={creating} className="px-5 py-2 rounded-xl bg-accent-primary hover:bg-accent-hover text-white text-xs font-mono font-bold transition-all disabled:opacity-50 cursor-pointer">
                      {creating ? 'Enqueuing...' : 'Create Job'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── VIEW: SCHEDULES CRUD ──
    function SchedulesView() {
      const [schedules, setSchedules] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [runningId, setRunningId] = useState(null);
      const [name, setName] = useState('');
      const [agent, setAgent] = useState('briefing_agent');
      const [goal, setGoal] = useState('');
      const [cronExpr, setCronExpr] = useState('0 9 * * *');
      const [isActive, setIsActive] = useState(true);
      const [saving, setSaving] = useState(false);

      const presets = [
        { label: 'Every 15 Minutes', expr: '*/15 * * * *' },
        { label: 'Hourly', expr: '0 * * * *' },
        { label: 'Daily at 9:00 AM', expr: '0 9 * * *' },
        { label: 'Twice Daily (9 AM & 5 PM)', expr: '0 9,17 * * *' },
        { label: 'Weekly (Monday 9 AM)', expr: '0 9 * * 1' },
      ];

      const loadSchedules = async () => {
        try {
          const res = await api.getSchedules();
          setSchedules(res || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { loadSchedules(); }, []);

      const handleToggle = async (sch) => {
        try {
          await api.updateSchedule(sch.id, { is_active: !sch.is_active });
          loadSchedules();
        } catch (err) {
          alert('Failed to update status: ' + err.message);
        }
      };

      const handleRun = async (sch) => {
        setRunningId(sch.id);
        try {
          const res = await api.runSchedule(sch.id);
          alert(`Triggered Job #${res.job_id.slice(0, 8)} successfully!`);
          loadSchedules();
        } catch (err) {
          alert('Trigger failed: ' + err.message);
        } finally {
          setRunningId(null);
        }
      };

      const handleDelete = async (id, sName) => {
        if (!confirm(`Delete schedule "${sName}"?`)) return;
        try {
          await api.deleteSchedule(id);
          loadSchedules();
        } catch (err) {
          alert('Delete failed: ' + err.message);
        }
      };

      const handleCreate = async (e) => {
        e.preventDefault();
        if (!name.trim() || !goal.trim()) return;
        setSaving(true);
        try {
          await api.createSchedule({ name, agent, goal, cron_expr: cronExpr, is_active: isActive });
          setIsModalOpen(false);
          setName('');
          setGoal('');
          setCronExpr('0 9 * * *');
          loadSchedules();
        } catch (err) {
          alert('Create failed: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-silver-500/40 pb-5">
            <div>
              <h2 className="text-2xl font-extrabold text-silver-900 tracking-tight flex items-center gap-2.5">
                <span>📅</span> Recurring Agent Automation Schedules
              </h2>
              <p className="text-sm text-silver-800 mt-1">
                Automate periodic autonomous briefings, repository scans, and research digests on cron cadences.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={loadSchedules} className="px-3.5 py-2 rounded-xl bg-white hover:bg-silver-100 border border-silver-300 text-silver-800 font-bold text-xs transition-all shadow-xs cursor-pointer">
                <span>↻ Refresh</span>
              </button>
              <button onClick={() => setIsModalOpen(true)} className="px-4 py-2 rounded-xl bg-accent-primary hover:bg-accent-hover text-white font-bold text-xs shadow-md transition-all cursor-pointer">
                <span>+ New Schedule</span>
              </button>
            </div>
          </div>

          {loading ? (
            <div className="p-12 text-center text-xs font-mono text-silver-600 bg-white rounded-2xl border border-silver-300">Loading schedules...</div>
          ) : schedules.length === 0 ? (
            <div className="p-12 text-center text-xs font-mono text-silver-600 bg-white rounded-2xl border border-silver-300">No schedules configured. Click &quot;+ New Schedule&quot; to create one.</div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {schedules.map(sch => (
                <div key={sch.id} className={`p-5 rounded-2xl border transition-all space-y-3.5 ${sch.is_active ? 'bg-white border-silver-300 shadow-sm' : 'bg-silver-100/70 border-silver-300/60 opacity-80'}`}>
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="font-bold text-sm text-silver-900">{sch.name}</span>
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-bold ${sch.is_active ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-slate-200 text-slate-700'}`}>
                          {sch.is_active ? 'ACTIVE' : 'PAUSED'}
                        </span>
                      </div>
                      <span className="text-xs font-mono text-silver-600 block">Agent: {sch.agent}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => handleToggle(sch)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-mono font-bold border transition-all cursor-pointer ${sch.is_active ? 'bg-silver-100 text-silver-700 border-silver-300 hover:bg-red-50 hover:text-red-700' : 'bg-emerald-50 text-emerald-800 border-emerald-300 hover:bg-emerald-100'}`}
                      >
                        {sch.is_active ? 'Pause' : 'Activate'}
                      </button>
                      <button onClick={() => handleDelete(sch.id, sch.name)} className="p-1 rounded-lg bg-silver-100 hover:bg-red-50 text-silver-600 hover:text-red-700 border border-silver-300 transition-colors cursor-pointer" title="Delete">
                        🗑️
                      </button>
                    </div>
                  </div>

                  <p className="text-xs text-silver-800 bg-silver-50 p-3 rounded-xl border border-silver-200 leading-relaxed font-sans">{sch.goal}</p>

                  <div className="flex items-center justify-between gap-2 pt-2 border-t border-silver-200 text-xs font-mono">
                    <span className="px-2.5 py-1 rounded-lg bg-silver-100 text-accent-primary font-bold border border-silver-300">
                      ⏰ {sch.cron_expr}
                    </span>
                    <button
                      onClick={() => handleRun(sch)}
                      disabled={runningId === sch.id}
                      className="px-3.5 py-1.5 rounded-xl bg-accent-primary hover:bg-accent-hover text-white text-xs font-mono font-bold flex items-center gap-1.5 shadow-xs transition-all disabled:opacity-50 cursor-pointer"
                    >
                      <span>▶</span>
                      <span>{runningId === sch.id ? 'Running...' : 'Run Now'}</span>
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-silver-300 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-silver-200 pb-3">
                  <h3 className="font-bold text-sm text-silver-900">Create Automation Schedule</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-silver-500 hover:text-silver-900 cursor-pointer">✕</button>
                </div>
                <form onSubmit={handleCreate} className="space-y-3.5">
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Name</label>
                    <input
                      type="text"
                      value={name}
                      onChange={e => setName(e.target.value)}
                      placeholder="e.g. Daily Executive Briefing"
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl px-3 py-2 text-xs text-silver-900 focus:outline-none focus:border-accent-primary"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Agent</label>
                    <select
                      value={agent}
                      onChange={e => setAgent(e.target.value)}
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl px-3 py-2 text-xs text-silver-900 focus:outline-none focus:border-accent-primary font-mono"
                    >
                      <option value="briefing_agent">Daily Briefing Agent</option>
                      <option value="research_agent">Research Agent</option>
                      <option value="growth_agent">Growth & Content Agent</option>
                      <option value="critic_agent">Critic Agent</option>
                      <option value="github_agent">GitHub Agent</option>
                      <option value="email_agent">Email Agent</option>
                      <option value="job_agent">Job Search Agent</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Goal</label>
                    <textarea
                      rows={3}
                      value={goal}
                      onChange={e => setGoal(e.target.value)}
                      placeholder="What should execute when triggered..."
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl p-3 text-xs text-silver-900 focus:outline-none focus:border-accent-primary"
                      required
                    />
                  </div>
                  <div className="space-y-2">
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase">Cadence Presets</label>
                    <div className="grid grid-cols-2 gap-1.5">
                      {presets.map(p => (
                        <button
                          key={p.expr}
                          type="button"
                          onClick={() => setCronExpr(p.expr)}
                          className={`p-2 rounded-xl border text-left text-xs transition-all cursor-pointer ${cronExpr === p.expr ? 'bg-amber-50 border-amber-300 text-amber-900 font-bold' : 'bg-silver-50 border-silver-200 text-silver-700'}`}
                        >
                          <div className="text-[11px]">{p.label}</div>
                          <div className="font-mono text-[10px] text-silver-500">{p.expr}</div>

                      ))}

                    <input
                      type="text"
                      value={cronExpr}
                      onChange={e => setCronExpr(e.target.value)}

                      className="w-full bg-silver-50 border border-silver-300 rounded-xl px-3 py-1.5 text-xs font-mono font-bold text-accent-primary focus:outline-none focus:border-accent-primary mt-1"
                      required
                    />

                  <div className="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="sch-act-idx" checked={isActive} onChange={e => setIsActive(e.target.checked)} />

                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-silver-200">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 rounded-xl bg-silver-100 text-silver-700 text-xs font-mono font-bold cursor-pointer">Cancel</button>
                    <button type="submit" disabled={saving} className="px-5 py-2 rounded-xl bg-accent-primary hover:bg-accent-hover text-white text-xs font-mono font-bold transition-all disabled:opacity-50 cursor-pointer">
