    // ── VIEW: MEMORY & EPISODIC CONTEXT ──
    function MemoryView() {
      const [memories, setMemories] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('pending');
      const [searchQuery, setSearchQuery] = useState('');
      const [isCreateOpen, setIsCreateOpen] = useState(false);
      const [newKind, setNewKind] = useState('fact');
      const [newKey, setNewKey] = useState('');
      const [newValue, setNewValue] = useState('');
      const [saving, setSaving] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [editKey, setEditKey] = useState('');
      const [editValue, setEditValue] = useState('');
      const [isSummarizeOpen, setIsSummarizeOpen] = useState(false);
      const [sessionId, setSessionId] = useState('');
      const [summarizing, setSummarizing] = useState(false);

      const loadMemories = async () => {
        try {
          const res = await api.getMemories({ limit: 100 });
          setMemories(res || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { loadMemories(); }, []);

      const handleConfirm = async (id) => {
        try {
          await api.confirmMemory(id);
          loadMemories();
        } catch (err) {
          alert('Confirm failed: ' + err.message);
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Purge this memory item from SQLite and Chroma vector store?')) return;
        try {
          await api.deleteMemory(id);
          loadMemories();
        } catch (err) {
          alert('Delete failed: ' + err.message);
        }
      };

      const handleCreate = async (e) => {
        e.preventDefault();
        if (!newValue.trim()) return;
        setSaving(true);
        try {
          await api.createMemory({ kind: newKind, key: newKey.trim() || undefined, value: newValue.trim(), pending_review: false });
          setIsCreateOpen(false);
          setNewKey('');
          setNewValue('');
          loadMemories();
        } catch (err) {
          alert('Create failed: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      const handleEdit = async (e) => {
        e.preventDefault();
        if (!editingItem || !editValue.trim()) return;
        try {
          await api.updateMemory(editingItem.id, { value: editValue.trim(), key: editKey.trim() || undefined });
          setEditingItem(null);
          loadMemories();
        } catch (err) {
          alert('Update failed: ' + err.message);
        }
      };

      const handleSummarize = async (e) => {
        e.preventDefault();
        if (!sessionId.trim()) return;
        setSummarizing(true);
        try {
          await api.summarizeSession(sessionId.trim());
          setIsSummarizeOpen(false);
          setSessionId('');
          loadMemories();
          alert('Session summarized and indexed into episodic memory!');
        } catch (err) {
          alert('Summarize failed: ' + err.message);
        } finally {
          setSummarizing(false);
        }
      };

      const pendingCount = memories.filter(m => Boolean(m.pending_review)).length;

      const filtered = memories.filter(item => {
        if (activeTab === 'pending' && !item.pending_review) return false;
        if (activeTab === 'facts' && (item.pending_review || item.kind === 'episode_summary')) return false;
        if (activeTab === 'episodes' && (item.pending_review || item.kind !== 'episode_summary')) return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const matchesV = item.value?.toLowerCase().includes(q);
          const matchesK = item.key ? item.key.toLowerCase().includes(q) : false;
          return matchesV || matchesK;
        }
        return true;
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-silver-500/40 pb-5">
            <div>
              <h2 className="text-2xl font-extrabold text-silver-900 tracking-tight flex items-center gap-2.5">
                <span>🧠</span> Long-Term Semantic & Episodic Memory
              </h2>
              <p className="text-sm text-silver-800 mt-1">
                Contextual facts, user preferences, and episode summaries with human confirmation review gates.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => setIsSummarizeOpen(true)} className="px-3.5 py-2 rounded-xl bg-white hover:bg-silver-100 border border-silver-300 text-silver-800 font-bold text-xs transition-all shadow-xs cursor-pointer">
                <span>✨ Summarize Session</span>
              </button>
              <button onClick={() => setIsCreateOpen(true)} className="px-4 py-2 rounded-xl bg-accent-primary hover:bg-accent-hover text-white font-bold text-xs shadow-md transition-all cursor-pointer">
                <span>+ Add Memory</span>
              </button>
            </div>
          </div>

          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div className="flex items-center gap-1 bg-white p-1 rounded-xl border border-silver-300 text-xs font-mono">
              <button
                onClick={() => setActiveTab('pending')}
                className={`flex items-center gap-2 px-3 py-1.5 rounded-lg transition-all cursor-pointer ${activeTab === 'pending' ? 'bg-accent-primary text-white font-bold' : 'text-silver-700 hover:text-silver-950'}`}
              >
                <span>Pending Review</span>
                {pendingCount > 0 && <span className="px-1.5 py-0.2 rounded-full text-[10px] font-bold bg-amber-600 text-white">{pendingCount}</span>}
              </button>
              <button
                onClick={() => setActiveTab('facts')}
                className={`px-3 py-1.5 rounded-lg transition-all cursor-pointer ${activeTab === 'facts' ? 'bg-accent-primary text-white font-bold' : 'text-silver-700 hover:text-silver-950'}`}
              >
                Facts & Preferences
              </button>
              <button
                onClick={() => setActiveTab('episodes')}
                className={`px-3 py-1.5 rounded-lg transition-all cursor-pointer ${activeTab === 'episodes' ? 'bg-accent-primary text-white font-bold' : 'text-silver-700 hover:text-silver-950'}`}
              >
                Episode Summaries
              </button>
            </div>

            <div className="min-w-[240px]">
              <input
                type="text"
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                placeholder="🔍 Search memory..."
                className="w-full bg-white border border-silver-300 rounded-xl px-3 py-2 text-xs text-silver-900 placeholder:text-silver-500 focus:outline-none focus:border-accent-primary font-mono shadow-xs"
              />
            </div>
          </div>

          {loading ? (
            <div className="p-12 text-center text-xs font-mono text-silver-600 bg-white rounded-2xl border border-silver-300">Loading memory store...</div>
          ) : filtered.length === 0 ? (
            <div className="p-12 text-center text-xs font-mono text-silver-600 bg-white rounded-2xl border border-silver-300">
              {activeTab === 'pending' ? 'No memories currently pending confirmation.' : 'No memory items matching view.'}
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {filtered.map(item => (
                <div key={item.id} className={`p-5 rounded-2xl border transition-all space-y-3 ${item.pending_review ? 'bg-amber-50/80 border-amber-300 shadow-sm' : 'bg-white border-silver-300 shadow-sm'}`}>
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-center gap-2">
                      <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase bg-silver-100 text-silver-800 border border-silver-300">
                        {item.kind.replace('_', ' ')}
                      </span>
                      {item.key && <span className="text-xs font-mono font-bold text-accent-primary">{item.key}</span>}
                    </div>

                    {item.pending_review ? (
                      <div className="flex items-center gap-1.5">
                        <button
                          onClick={() => handleConfirm(item.id)}
                          className="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-mono font-bold transition-all shadow-xs cursor-pointer"
                        >
                          ✓ Confirm
                        </button>
                        <button
                          onClick={() => handleDelete(item.id)}
                          className="p-1 rounded-lg bg-red-50 hover:bg-red-600 text-red-700 hover:text-white border border-red-200 transition-colors cursor-pointer"
                          title="Reject"
                        >
                          ✕
                        </button>
                      </div>
                    ) : (
                      <div className="flex items-center gap-1">
                        <button
                          onClick={() => { setEditingItem(item); setEditKey(item.key || ''); setEditValue(item.value); }}
                          className="p-1 rounded-lg bg-silver-100 hover:bg-silver-200 text-silver-700 border border-silver-300 transition-colors cursor-pointer"
                          title="Edit"
                        >
                          ✏️
                        </button>
                        <button
                          onClick={() => handleDelete(item.id)}
                          className="p-1 rounded-lg bg-silver-100 hover:bg-red-50 text-silver-700 hover:text-red-700 border border-silver-300 transition-colors cursor-pointer"
                          title="Delete"
                        >
                          🗑️
                        </button>
                      </div>
                    )}
                  </div>

                  <p className="text-xs text-silver-800 bg-silver-50 p-3 rounded-xl border border-silver-200 leading-relaxed font-sans">{item.value}</p>

                  <div className="flex items-center justify-between text-[11px] font-mono text-silver-500 pt-1 border-t border-silver-200">
                    <span>#{item.id.slice(0, 8)}</span>
                    <span>{new Date(item.created_at).toLocaleDateString()}</span>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Add Memory Modal */}
          {isCreateOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-silver-300 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-silver-200 pb-3">
                  <h3 className="font-bold text-sm text-silver-900">Record Memory Item</h3>
                  <button onClick={() => setIsCreateOpen(false)} className="text-silver-500 hover:text-silver-900 cursor-pointer">✕</button>
                </div>
                <form onSubmit={handleCreate} className="space-y-3.5">
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Kind</label>
                    <select
                      value={newKind}
                      onChange={e => setNewKind(e.target.value)}
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl px-3 py-2 text-xs text-silver-900 focus:outline-none focus:border-accent-primary font-mono"
                    >
                      <option value="fact">Fact (Knowledge statement)</option>
                      <option value="preference">Preference (User style/setting)</option>
                      <option value="episode_summary">Episode Summary</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Key / Topic (Optional)</label>
                    <input
                      type="text"
                      value={newKey}
                      onChange={e => setNewKey(e.target.value)}
                      placeholder="e.g. target_role, tone_preference"
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl px-3 py-1.5 text-xs text-silver-900 focus:outline-none focus:border-accent-primary font-mono"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Value</label>
                    <textarea
                      rows={3}
                      value={newValue}
                      onChange={e => setNewValue(e.target.value)}
                      placeholder="Knowledge content for semantic retrieval..."
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl p-3 text-xs text-silver-900 focus:outline-none focus:border-accent-primary"
                      required
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-silver-200">
                    <button type="button" onClick={() => setIsCreateOpen(false)} className="px-4 py-2 rounded-xl bg-silver-100 text-silver-700 text-xs font-mono font-bold cursor-pointer">Cancel</button>
                    <button type="submit" disabled={saving} className="px-5 py-2 rounded-xl bg-accent-primary hover:bg-accent-hover text-white text-xs font-mono font-bold transition-all disabled:opacity-50 cursor-pointer">
                      {saving ? 'Saving...' : 'Record'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Edit Memory Modal */}
          {editingItem && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-silver-300 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-silver-200 pb-3">
                  <h3 className="font-bold text-sm text-silver-900">Edit Memory Item</h3>
                  <button onClick={() => setEditingItem(null)} className="text-silver-500 hover:text-silver-900 cursor-pointer">✕</button>
                </div>
                <form onSubmit={handleEdit} className="space-y-3.5">
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Key</label>
                    <input
                      type="text"
                      value={editKey}
                      onChange={e => setEditKey(e.target.value)}
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl px-3 py-1.5 text-xs text-silver-900 focus:outline-none focus:border-accent-primary font-mono"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Value</label>
                    <textarea
                      rows={4}
                      value={editValue}
                      onChange={e => setEditValue(e.target.value)}
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl p-3 text-xs text-silver-900 focus:outline-none focus:border-accent-primary"
                      required
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-silver-200">
                    <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-2 rounded-xl bg-silver-100 text-silver-700 text-xs font-mono font-bold cursor-pointer">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-accent-primary hover:bg-accent-hover text-white text-xs font-mono font-bold cursor-pointer">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Summarize Session Modal */}
          {isSummarizeOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-silver-300 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-silver-200 pb-3">
                  <h3 className="font-bold text-sm text-silver-900">Summarize Conversation Session</h3>
                  <button onClick={() => setIsSummarizeOpen(false)} className="text-silver-500 hover:text-silver-900 cursor-pointer">✕</button>
                </div>
                <form onSubmit={handleSummarize} className="space-y-3.5">
                  <p className="text-xs text-silver-700 leading-relaxed">
                    Provide a Conversation ID to extract key insights, decisions, and store them into episodic vector memory.
                  </p>
                  <div>
                    <label className="block text-[11px] font-mono font-bold text-silver-700 uppercase mb-1">Conversation ID</label>
                    <input
                      type="text"
                      value={sessionId}
                      onChange={e => setSessionId(e.target.value)}
                      placeholder="e.g. conv-xyz or UUID"
                      className="w-full bg-silver-50 border border-silver-300 rounded-xl px-3 py-1.5 text-xs text-silver-900 focus:outline-none focus:border-accent-primary font-mono"
                      required
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-silver-200">
                    <button type="button" onClick={() => setIsSummarizeOpen(false)} className="px-4 py-2 rounded-xl bg-silver-100 text-silver-700 text-xs font-mono font-bold cursor-pointer">Cancel</button>
                    <button type="submit" disabled={summarizing} className="px-5 py-2 rounded-xl bg-accent-primary hover:bg-accent-hover text-white text-xs font-mono font-bold disabled:opacity-50 cursor-pointer">
                      {summarizing ? 'Summarizing...' : 'Summarize & Index'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── VIEW: SETTINGS & GUARDRAILS ──
    function SettingsView({ silverShade, setSilverShade }) {
      const [flags, setFlags] = useState([]);
      const [loading, setLoading] = useState(true);
      const [killSwitchActive, setKillSwitchActive] = useState(false);
      const [budgetCeiling, setBudgetCeiling] = useState('10.00');
      const [savingBudget, setSavingBudget] = useState(false);
      const [togglingKill, setTogglingKill] = useState(false);

      const loadSettings = async () => {
        try {
          const res = await api.getSystemFlags();
          setFlags(res || []);
          const k = (res || []).find(f => f.key === 'kill_switch');
          setKillSwitchActive(k ? ['true', 'on', '1'].includes(k.value.toLowerCase()) : false);
          const b = (res || []).find(f => f.key === 'daily_budget_usd');
          if (b) setBudgetCeiling(b.value);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { loadSettings(); }, []);

      const handleToggleKill = async () => {
        const next = !killSwitchActive;
        const msg = next
          ? 'EMERGENCY ACTION: Activating the Kill Switch will immediately abort all running agent jobs and refuse new autonomous dispatches. Proceed?'
          : 'Deactivate the Kill Switch and resume autonomous agent operations?';
        if (!confirm(msg)) return;
        setTogglingKill(true);
        try {
          await api.toggleKillSwitch(next);
          setKillSwitchActive(next);
          loadSettings();
        } catch (err) {
          alert('Toggle failed: ' + err.message);
        } finally {
          setTogglingKill(false);
        }
      };

      const handleSaveBudget = async (e) => {
        e.preventDefault();
        const v = parseFloat(budgetCeiling);
        if (isNaN(v) || v <= 0) {
          alert('Please enter a valid positive number.');
          return;
        }
        setSavingBudget(true);
        try {
          await api.setDailyBudget(v);
          loadSettings();
          alert(`Daily budget ceiling set to $${v.toFixed(2)} USD!`);
        } catch (err) {
          alert('Save failed: ' + err.message);
        } finally {
          setSavingBudget(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-silver-500/40 pb-5">
            <div>
              <h2 className="text-2xl font-extrabold text-silver-900 tracking-tight flex items-center gap-2.5">
                <span>⚙️</span> System Guardrails & Executive Settings
              </h2>
              <p className="text-sm text-silver-800 mt-1">
                Emergency circuit controls, daily token expenditure hard stops, and executive aesthetic configurations.
              </p>
            </div>
            <button onClick={loadSettings} className="px-3.5 py-2 rounded-xl bg-white hover:bg-silver-100 border border-silver-300 text-silver-800 font-bold text-xs transition-all shadow-xs cursor-pointer">
              <span>↻ Refresh</span>
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Kill Switch Card */}
            <div className={`p-6 rounded-2xl border transition-all space-y-4 ${killSwitchActive ? 'bg-red-50 border-red-300 shadow-md ring-2 ring-red-400/40' : 'bg-white border-silver-300 shadow-sm'}`}>
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-sm font-bold text-silver-900 font-mono">Emergency Kill Switch</h3>
                  <span className="text-[11px] text-silver-600 block">Global 1-Step Abort Guard</span>
                </div>
                <span className={`px-2.5 py-1 rounded-full text-[10px] font-mono font-bold ${killSwitchActive ? 'bg-red-600 text-white animate-pulse' : 'bg-emerald-50 text-emerald-800 border border-emerald-300'}`}>
                  {killSwitchActive ? 'ACTIVE / HALTED' : 'NORMAL / INACTIVE'}
                </span>
              </div>
              <p className="text-xs text-silver-700 leading-relaxed">
                When activated, every autonomous loop checks this flag before each tool call and aborts immediately. Workers refuse newly claimed jobs.
              </p>
              <button
                onClick={handleToggleKill}
                disabled={togglingKill}
                className={`w-full py-2.5 rounded-xl font-mono text-xs font-bold transition-all shadow-sm cursor-pointer ${killSwitchActive ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-red-600 hover:bg-red-700 text-white'}`}
              >
                {killSwitchActive ? 'Deactivate Kill Switch & Resume' : 'Activate Emergency Kill Switch'}
              </button>
            </div>

            {/* Daily Budget Card */}
            <div className="bg-white border border-silver-300 rounded-2xl p-6 shadow-sm space-y-4">
              <div>
                <h3 className="text-sm font-bold text-silver-900 font-mono">Daily Budget Ceiling</h3>
                <span className="text-[11px] text-silver-600 block">LLM Spend Hard Stop</span>
              </div>
              <p className="text-xs text-silver-700 leading-relaxed">
                Sets the daily expenditure ceiling across all Groq and OpenAI model inference calls. Once breached, subsequent steps abort with BudgetExceededError.
              </p>
              <form onSubmit={handleSaveBudget} className="flex gap-2">
                <div className="relative flex-1">
                  <span className="absolute left-3 top-2 text-xs font-mono text-silver-500">$</span>
                  <input
                    type="number"
                    step="0.01"
                    min="0.10"
                    value={budgetCeiling}
                    onChange={e => setBudgetCeiling(e.target.value)}
                    className="w-full bg-silver-50 border border-silver-300 rounded-xl pl-7 pr-3 py-1.5 text-xs font-mono font-bold text-accent-primary focus:outline-none focus:border-accent-primary"
                    required
                  />
                </div>
                <button
                  type="submit"
                  disabled={savingBudget}
                  className="px-4 py-1.5 rounded-xl bg-accent-primary hover:bg-accent-hover text-white text-xs font-mono font-bold transition-all disabled:opacity-50 cursor-pointer"
                >
                  {savingBudget ? 'Saving...' : 'Set Budget'}
                </button>
              </form>
            </div>
          </div>

          {/* System Flags Table */}
          <div className="bg-white rounded-2xl border border-silver-300 p-6 shadow-sm space-y-4">
            <h3 className="font-bold text-xs text-silver-900 font-mono uppercase tracking-wider">
              Active System Flags Database ({flags.length})
            </h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs font-mono">
                <thead>
                  <tr className="border-b border-silver-300 text-silver-600">
                    <th className="p-2">Flag Key</th>
                    <th className="p-2">Value</th>
                    <th className="p-2 text-right">Updated At</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-silver-200">
                  {flags.map(f => (
                    <tr key={f.key}>
                      <td className="p-2 font-bold text-accent-primary">{f.key}</td>
                      <td className="p-2 text-silver-900">{f.value}</td>
                      <td className="p-2 text-right text-silver-600">{new Date(f.updated_at).toLocaleString()}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Theme Selector */}
          <div className="bg-white rounded-2xl border border-silver-300 p-6 shadow-sm space-y-4">
            <h3 className="font-bold text-xs text-silver-900 font-mono uppercase tracking-wider">
              Metallic Silver Aesthetic Palette
            </h3>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              {[
                { id: 'light', label: 'Silver Light', hex: '#DCE2E9', desc: 'Soft morning tone' },
                { id: 'medium', label: 'Metallic Silver', hex: '#B0B8C4', desc: 'True metallic control plane' },
                { id: 'deep', label: 'Deep Silver', hex: '#96A0AF', desc: 'High-contrast executive' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setSilverShade(t.id)}
                  className={`p-3.5 rounded-xl border text-left transition-all cursor-pointer ${silverShade === t.id ? 'bg-amber-50/50 border-accent-primary shadow-xs' : 'bg-silver-50 border-silver-200 hover:border-silver-300'}`}
                >
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-bold text-xs text-silver-900">{t.label}</span>
                    <span className="w-4 h-4 rounded-full border border-black/20" style={{ backgroundColor: t.hex }} />
                  </div>
                  <p className="text-[10px] text-silver-600">{t.desc}</p>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ── MAIN SHELL / GLOBAL LAYOUT ──
    function App() {
      const [tab, setTab] = useState('dispatch');
      const [runId, setRunId] = useState(null);
      const [pendingCount, setPendingCount] = useState(0);
      const [circuitState, setCircuitState] = useState('CLOSED');
      const [connectionStatus, setConnectionStatus] = useState('connected');
      
      // Silver shade palette options
      const [silverShade, setSilverShade] = useState('medium'); // 'light' (#DCE2E9) | 'medium' (#B0B8C4) | 'deep' (#96A0AF)

      useEffect(() => {
        const bgColors = {
          light: '#DCE2E9',
          medium: '#B0B8C4',
          deep: '#96A0AF'
        };
        document.body.style.backgroundColor = bgColors[silverShade] || '#B0B8C4';
      }, [silverShade]);

      // Subscribe to real-time SSE stream for connection status
      useEffect(() => {
        const unsub = api.subscribeJobEvents({
          onEvent: () => {},
          onStatusChange: (status) => setConnectionStatus(status)
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        const poll = async () => {
          try {
            const data = await api.getApprovals('pending');
            const pending = data.total || 0;
            setPendingCount(pending);
            if (window.toji?.setAvatarState) {
              if (pending > 0) {
                window.toji.setAvatarState('needs-you');
              }
            }
          } catch {}
          try {
            const c = await api.getCircuit();
            setCircuitState(c.state || 'CLOSED');
          } catch {}
        };
        poll();
        const t = setInterval(poll, 5000);
        return () => clearInterval(t);
      }, []);

      useEffect(() => {
        document.body.style.overflow = tab === 'dispatch' ? 'hidden' : 'auto';
        return () => { document.body.style.overflow = 'auto'; };
      }, [tab]);

      const navItems = [
        { id: 'dispatch', label: 'Dispatch', icon: '💬' },
        { id: 'jobs', label: 'Jobs Timeline', icon: '💼' },
        { id: 'schedules', label: 'Schedules', icon: '📅' },
        { id: 'memory', label: 'Memory', icon: '🧠' },
        { id: 'pipelines', label: 'Pipelines', icon: '🚀' },
        { id: 'approvals', label: 'Approvals', icon: '🛡️', badge: pendingCount > 0 ? pendingCount : null },
        { id: 'eval', label: 'Benchmark', icon: '📊' },
        { id: 'settings', label: 'Settings', icon: '⚙️' },
        { id: 'diagnostics', label: 'Diagnostics', icon: '🩺' },
      ];

      return (
        <div className={`text-text-primary flex flex-col ${tab === 'dispatch' ? 'h-screen max-h-screen overflow-hidden' : 'min-h-screen'}`}>
          {/* Top Executive Header */}
          <header className="sticky top-0 z-50 bg-white/95 border-b border-silver-400/80 backdrop-blur-md px-6 py-2.5 flex items-center justify-between shadow-xs flex-shrink-0">
            <div className="flex items-center gap-6">
              {/* Brand Emblem */}
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl flex items-center justify-center overflow-hidden border border-silver-400/80 shadow-xs bg-slate-900 flex-shrink-0">
                  <img src="/static/logo.png" alt="Orchestrator Emblem" className="w-full h-full object-cover" />
                </div>

                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-extrabold text-base text-silver-900 tracking-tight leading-none">
                      Orchestrator
                    </h1>
                    <span className="text-[10px] font-mono font-extrabold px-1.5 py-0.5 rounded bg-silver-100 text-accent-primary border border-silver-300">
                      CONTROL PLANE
                    </span>
                  </div>
                  <span className="text-[10px] font-mono text-silver-600 block mt-0.5">
                    Multi-Agent Core Engine
                  </span>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="hidden md:flex items-center gap-1.5 ml-4 bg-silver-100/90 p-1 rounded-xl border border-silver-300">
                {navItems.map(item => {
                  const active = tab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => { setTab(item.id); if (item.id === 'pipelines') setRunId(null); }}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                        active ? 'bg-accent-primary text-white shadow-xs font-bold' : 'text-silver-700 hover:text-silver-950 hover:bg-white/60'
                      }`}
                    >
                      <span>{item.icon}</span>
                      <span>{item.label}</span>
                      {item.badge && (
                        <span className={`text-[10px] font-bold px-1.5 py-0.2 rounded-full ${active ? 'bg-white text-accent-primary' : 'bg-amber-600 text-white'}`}>
                          {item.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* Right Health, Tone Selector & Circuit Capsule */}
            <div className="flex items-center gap-3">
              {/* Connection Status Badge */}
              <ConnectionStatusBadge status={connectionStatus} />

              {/* Silver Shade Selector */}
              <div className="hidden lg:flex items-center gap-1 px-2 py-1 rounded-xl bg-silver-100 border border-silver-300 text-[11px] font-mono">
                <span className="text-silver-600 mr-1">Silver:</span>
                {[
                  { id: 'light', label: 'Light' },
                  { id: 'medium', label: 'Silver' },
                  { id: 'deep', label: 'Darker' }
                ].map(s => (
                  <button
                    key={s.id}
                    onClick={() => setSilverShade(s.id)}
                    className={`px-2 py-0.5 rounded-md transition-all cursor-pointer ${
                      silverShade === s.id
                        ? 'bg-white text-silver-900 font-bold shadow-xs'
                        : 'text-silver-600 hover:text-silver-900'
                    }`}
                  >
                    {s.label}
                  </button>
                ))}
              </div>

              <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-silver-50 border border-silver-300 text-xs font-mono">
                <span className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-600 animate-pulse" />
                  <span className="text-silver-700">Core API: Online</span>
                </span>
                <span className="text-silver-300">|</span>
                <span className="flex items-center gap-1.5">
                  <span className="text-silver-700">Circuit:</span>
                  <span className={circuitState === 'CLOSED' ? "text-emerald-700 font-bold" : "text-red-600 font-bold"}>
                    {circuitState}
                  </span>
                </span>
              </div>

              <a
                href="/docs"
                target="_blank"
                rel="noreferrer"
                className="px-3 py-1.5 rounded-xl bg-silver-50 hover:bg-silver-100 border border-silver-300 text-xs font-mono text-accent-primary font-bold transition-all shadow-xs"
              >
                Docs &rarr;
              </a>
            </div>
          </header>

          {/* Mobile Tab Bar */}
          <div className="md:hidden flex overflow-x-auto bg-white border-b border-silver-300 p-2 gap-1 flex-shrink-0">
            {navItems.map(item => (
              <button
                key={item.id}
                onClick={() => { setTab(item.id); if (item.id === 'pipelines') setRunId(null); }}
                className={`flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer ${
                  tab === item.id ? 'bg-accent-primary text-white' : 'text-silver-700'
                }`}
              >
                <span>{item.icon}</span>
                <span>{item.label}</span>
              </button>
            ))}
          </div>

          {/* Main Stage */}
          <main className={`w-full mx-auto ${tab === 'dispatch' ? 'flex-1 min-h-0 w-full px-2 sm:px-4 md:px-5 py-2 flex flex-col overflow-hidden' : 'flex-1 w-full max-w-[1750px] p-4 md:p-6 lg:p-8'}`}>
            {tab === 'dispatch' && <DispatchView />}
            {tab === 'jobs' && <JobsView />}
            {tab === 'schedules' && <SchedulesView />}
            {tab === 'memory' && <MemoryView />}
            {tab === 'pipelines' && <PipelinesView onSelectRun={id => { setRunId(id); setTab('runs'); }} />}
            {tab === 'runs' && (runId ? <RunDetailView runId={runId} onBack={() => setTab('pipelines')} /> : <PipelinesView onSelectRun={id => { setRunId(id); setTab('runs'); }} />)}
            {tab === 'approvals' && <ApprovalsView />}
            {tab === 'eval' && <EvalView />}
            {tab === 'settings' && <SettingsView silverShade={silverShade} setSilverShade={setSilverShade} />}
            {tab === 'diagnostics' && <DiagnosticsView />}
          </main>

          {/* Sleek Minimal Footer */}
          <footer className={`border-t border-silver-400/60 text-center font-mono text-silver-700 bg-white/40 flex-shrink-0 ${tab === 'dispatch' ? 'py-1.5 px-4 text-[11px]' : 'py-4 px-6 text-xs'}`}>
            Orchestrator Agent Core Service • Metallic Silver Executive Plane • Audited Concurrency & Security Invariants
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
